<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" role="img" aria-labelledby="t d">
  <title id="t">Heizenergiebedarf vor und nach der Sanierung</title>
  <desc id="d">Balkendiagramm: Heizenergiebedarf 182 kWh je Quadratmeter und Jahr vor der Sanierung, 48 kWh je Quadratmeter und Jahr nach der Sanierung.</desc>
  <rect x="0" y="0" width="480" height="240" fill="#ffffff"/>
  <line x1="60" y1="200" x2="460" y2="200" stroke="#333333" stroke-width="2"/>
  <rect x="110" y="20" width="110" height="180" fill="#9c3d2e"/>
  <rect x="290" y="152.5" width="110" height="47.5" fill="#2e6b9c"/>
  <text x="165" y="14" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#1d1d1b">182</text>
  <text x="345" y="146" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#1d1d1b">48</text>
  <text x="165" y="222" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#1d1d1b">vorher</text>
  <text x="345" y="222" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#1d1d1b">nachher</text>
  <text x="20" y="110" font-family="sans-serif" font-size="12" fill="#1d1d1b" transform="rotate(-90 20 110)">kWh/(m²·a)</text>
</svg>
