[package]
name = "hpro-mobil"
version = "0.1.0"
description = "hpro Reader – Mobil-Hülle (Tauri 2, Android) um den Web-Kern (P12-Spike)"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.80"

[lib]
name = "hpro_mobil_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-hpro-mobil = { path = "../tauri-plugin-hpro-mobil" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
percent-encoding = "2"

[features]
# Test build only (mobil/scripts/e2e-*.sh): adds `e2e_canary`, `e2e_report`, `e2e_exit`, logs
# every accepted command and runs the driver huelle/e2e/... compiled in. Never part of a release.
e2e = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
